name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
        env:
          # Repository variables (Settings → Secrets and variables → Actions → Variables).
          # None of these are secrets.
          VITE_STORAGE: ${{ vars.VITE_STORAGE }}
          VITE_AAD_CLIENT_ID: ${{ vars.VITE_AAD_CLIENT_ID }}
          VITE_AAD_TENANT_ID: ${{ vars.VITE_AAD_TENANT_ID }}
          VITE_SP_SITE_ID: ${{ vars.VITE_SP_SITE_ID }}
          VITE_SP_LIST_ID: ${{ vars.VITE_SP_LIST_ID }}
          VITE_SP_SETTINGS_LIST_ID: ${{ vars.VITE_SP_SETTINGS_LIST_ID }}
          VITE_SP_TEMPLATES_LIST_ID: ${{ vars.VITE_SP_TEMPLATES_LIST_ID }}
          VITE_GRAPH_SCOPE: ${{ vars.VITE_GRAPH_SCOPE }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
